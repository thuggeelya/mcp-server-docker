name: MCP Shield

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - uses: thuggeelya/mcp-shield-action@644c14893e14c6b79aee14a5335ac3f9b12b08a4 # v1
        with:
          server: 'mcp-server-docker'
